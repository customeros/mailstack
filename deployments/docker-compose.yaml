networks:
  mailstack:
volumes:
  rabbitmq_data:
  postgres_data_mailstack:
  postgres_data_openline:
  clickhouse_data: # New volume for ClickHouse data
services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    networks:
      - mailstack
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./provision/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./provision/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "6831:6831/tcp"
      - "4317:4317"
      - "4318:4318"
      - "14268:14268"
    environment:
      - LOG_LEVEL=debug
    networks:
      - mailstack
  postgres-mailstack:
    image: postgres:14.5
    container_name: postgres-mailstack
    networks:
      - mailstack
    ports:
      - "5555:5432"
    volumes:
      - postgres_data_mailstack:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mailstack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d mailstack -h localhost -p 5432",
        ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    container_name: clickhouse
    networks:
      - mailstack
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Optional: Mount custom configuration if needed
      # - ./provision/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom-config.xml
      # - ./provision/clickhouse/users.xml:/etc/clickhouse-server/users.d/custom-users.xml
    environment:
      # Set these for explicit authentication
      CLICKHOUSE_DB: mailstack
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://localhost:8123/ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    networks:
      - mailstack
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./provision/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4319:4317"  # OTLP gRPC receiver (mapped to 4319 externally)
      - "4320:4318"  # OTLP HTTP receiver (mapped to 4320 externally)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:13133"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
