syntax = "proto3";

package mailstack;

option go_package = "github.com/customeros/mailstack/proto/pb";

import "schema/email_classification_enum.proto";

// Message to indicate that inbound email processing has been completed
message InboundEmailProcessingCompleted {
  string email_id = 1;
  string mailbox_id = 2;
  EmailClassification classification = 3;
  string thread_id = 4;
}
