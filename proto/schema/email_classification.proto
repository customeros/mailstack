syntax = "proto3";

package mailstack;

option go_package = "github.com/customeros/mailstack/proto/pb";

import "schema/email_address.proto";

// Enum for email classification types
enum EmailClassification {
  EMAIL_CLASSIFICATION_UNKNOWN = 0;
  EMAIL_AUTORESPONDER = 1;
  EMAIL_BULK = 2;
  EMAIL_INTERNAL = 3;
  EMAIL_OK = 4;
  EMAIL_SENSITIVE = 5;
  EMAIL_SPAM = 6;
  EMAIL_WARMER = 7;
  EMAIL_BOUNCE = 8;
}

// Request message for email classification
message EmailClassificationRequest {
  string email_id = 1;
  string subject = 2;
  EmailAddress from = 3;
  repeated EmailAddress to = 4;
  repeated EmailAddress cc = 5;
  repeated EmailAddress bcc = 6;
  EmailAddress reply_to = 7;
  string return_path = 8;
  string unsubscribe = 9;
  string precedence = 10;
  string sender = 11;
  string x_auto_reply = 12;
  string x_auto_response = 13;
  string x_loop = 14;
  string x_failed_recipients = 15;
  string content_description = 16;
  string feedback_id = 17;
  string forwarded_for = 18;
  string dkim = 19;
  string spf = 20;
  string dmarc = 21;
  string list_unsubscribe = 22;
  string auto_submitted = 23;
}

// Response message for email classification
message EmailClassificationResponse {
  string email_id = 1;
  EmailClassification classification = 2;
  string details = 3;
  string error_message = 4;
}
